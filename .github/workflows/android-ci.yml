name: Android CI

on:
  push:
    branches: [ "main", "fix/jdk-asset-packaging" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for preview tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run browser preview automated tests
        run: node --test web-preview/tests/*.test.cjs

      - name: Validate offline CodeMirror mobile IDE assets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('app/src/main/assets/ide/index.html', 'utf8');
          for (const asset of ['codemirror.min.js', 'codemirror.min.css', 'material-darker.min.css']) {
            if (!fs.existsSync('app/src/main/assets/ide/' + asset)) throw new Error('Missing IDE asset: ' + asset);
          }
          const scripts = [...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];
          if (!scripts.length) throw new Error('No inline IDE controller script found');
          for (const script of scripts) new vm.Script(script[1]);
          console.log('CodeMirror assets and inline controller syntax verified');
          NODE
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nice-Java-IDE-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
