name: Android CI

on:
  push:
    branches: [ "main", "fix/jdk-asset-packaging", "fix/build180-kotlin-runtime-permission" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inspect the exact Android JDK release archives
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, tarfile, urllib.request
          assets = {
              "selected": "https://github.com/MobileStudio-AndroidIDE/MobileStudio_AndroidIDE/releases/download/jdk21-android-21.0.14/jdk21-android-arm64.tar.gz",
              "complete": "https://github.com/MobileStudio-AndroidIDE/MobileStudio_AndroidIDE/releases/download/jdk21-android-21.0.14/jdk21-android-arm64-complete.tar.gz",
          }
          for label, url in assets.items():
              path = f"/tmp/{label}-jdk.tar.gz"
              print(f"Downloading {label} archive: {url}", flush=True)
              urllib.request.urlretrieve(url, path)
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              print(f"{label} sha256={digest}", flush=True)
              with tarfile.open(path, "r:gz") as archive:
                  matches = [m for m in archive.getmembers()
                             if "modules" in m.name.lower() or m.name.endswith("/bin/java") or m.name.endswith("/bin/javac")]
                  for m in matches:
                      print(f"{label} ENTRY name={m.name!r} type={m.type!r} size={m.size} "
                            f"issparse={m.issparse()} linkname={m.linkname!r} "
                            f"pax={m.pax_headers}", flush=True)
                  members = archive.getmembers()
                  module_files = [m for m in members if m.name.rstrip("/").endswith("/lib/modules")
                                  or m.name.rstrip("/") == "lib/modules"]
                  if not module_files:
                      print(f"{label}: NO lib/modules entry in archive", flush=True)
                  for m in module_files:
                      print(f"{label}: modules isfile={m.isfile()} islnk={m.islnk()} "
                            f"issym={m.issym()} size={m.size}", flush=True)
                  if label == "complete":
                      def find_entry(suffix):
                          return next((m for m in members if m.name.rstrip("/").endswith(suffix)), None)
                      java_entry = find_entry("/bin/java")
                      javac_entry = find_entry("/bin/javac")
                      modules_entry = find_entry("/lib/modules")
                      missing = [name for name, item in [("bin/java", java_entry),
                                 ("bin/javac", javac_entry), ("lib/modules", modules_entry)] if item is None]
                      if missing:
                          raise SystemExit("Complete JDK archive missing required paths: " + repr(missing))
                      # lib/modules is the binary jimage file in a normal JDK image.
                      # It must be a populated regular TAR file, not an exploded directory.
                      if not modules_entry.isfile() or modules_entry.size < 1024 * 1024:
                          raise SystemExit("Complete JDK lib/modules must be a populated regular jimage file")
                      if not java_entry.isfile() or not javac_entry.isfile():
                          raise SystemExit("Complete JDK bin/java and bin/javac must be regular files")
                      print("PASS: complete JDK has bin/java, bin/javac and populated regular-file lib/modules jimage", flush=True)
          PY

      - name: Set up Node.js for preview tests
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run browser preview automated tests
        run: node --test web-preview/tests/*.test.cjs

      - name: Validate offline CodeMirror mobile IDE assets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('app/src/main/assets/ide/index.html', 'utf8');
          const assetDir = 'app/src/main/assets/ide/';
          for (const asset of ['codemirror.min.js', 'codemirror.min.css', 'material-darker.min.css']) {
            const assetPath = assetDir + asset;
            if (!fs.existsSync(assetPath) || fs.statSync(assetPath).size < 100) {
              throw new Error('Missing or invalid IDE asset: ' + assetPath);
            }
          }
          if (!html.includes('src="file:///android_asset/ide/codemirror.min.js"')) {
            throw new Error('index.html does not load the packaged CodeMirror JS asset');
          }
          // Parse both JavaScript sources independently. This catches corruption
          // inside the minified vendor bundle as well as the app controller.
          new vm.Script(fs.readFileSync(assetDir + 'codemirror.min.js', 'utf8'));
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (scripts.length !== 1) throw new Error('Expected exactly one inline IDE controller script');
          new vm.Script(scripts[0][1]);
          for (const language of ['java', 'kotlin', 'html', 'css', 'js']) {
            if (!html.includes('option value="' + language + '"')) {
              throw new Error('Missing visible language selector option: ' + language);
            }
          }
          if (!html.includes("languageSelect.addEventListener('change'")) {
            throw new Error('Language selector change handler is missing');
          }
          console.log('CodeMirror assets, controller syntax and Java/Kotlin/HTML/CSS/JS selector verified');
          NODE
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.2.12479018 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'

      - name: Build debug APK
        run: gradle --no-daemon --warning-mode all :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Nice-Java-IDE-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
