plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meraj.nicejavaide'
    compileSdk 35

    androidResources {
        noCompress += ['gz']
    }

    defaultConfig {
        applicationId 'com.meraj.nicejavaide'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations {
    javaProjectLibraries
}

dependencies {
    // Libraries bundled for offline Java projects (not Android app runtime dependencies).
    javaProjectLibraries 'com.google.code.gson:gson:2.13.1'
    javaProjectLibraries 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    javaProjectLibraries 'com.squareup.okhttp3:okhttp:4.12.0'
    javaProjectLibraries 'org.apache.commons:commons-lang3:3.18.0'
    javaProjectLibraries 'commons-io:commons-io:2.20.0'
    javaProjectLibraries 'org.apache.commons:commons-csv:1.14.1'
    javaProjectLibraries 'commons-codec:commons-codec:1.19.0'
    javaProjectLibraries 'org.bouncycastle:bcprov-jdk18on:1.81'
    javaProjectLibraries 'junit:junit:4.13.2'
    javaProjectLibraries 'com.h2database:h2:2.3.232'
    javaProjectLibraries 'org.slf4j:slf4j-api:2.0.17'

    // Kotlin/JVM runtime and common offline libraries for user projects.
    javaProjectLibraries 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'
    javaProjectLibraries 'org.jetbrains.kotlin:kotlin-reflect:2.4.21'
    javaProjectLibraries 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2'
    javaProjectLibraries 'org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.9.0'
    javaProjectLibraries 'org.jetbrains.kotlinx:kotlinx-datetime-jvm:0.7.1'
    javaProjectLibraries 'org.jetbrains.kotlin:kotlin-test:2.4.21'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
}

def javaLibrariesOutput = layout.buildDirectory.dir('generated/java-libs')
android.sourceSets.main.assets.srcDir(javaLibrariesOutput)

tasks.register('bundleJavaProjectLibraries', Sync) {
    from configurations.javaProjectLibraries
    into javaLibrariesOutput.map { it.dir('java-libs') }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def kotlinCompilerArchive = javaLibrariesOutput.get().file('kotlin-compiler-2.4.21.zip')
def kotlinCompilerUrl = 'https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip'
def kotlinCompilerSha256 = '7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd'

tasks.register('downloadKotlinCompiler') {
    outputs.file(kotlinCompilerArchive)
    doLast {
        def archiveFile = kotlinCompilerArchive.asFile
        if (archiveFile.exists()) {
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            archiveFile.withInputStream { input ->
                byte[] buffer = new byte[1024 * 1024]
                int count
                while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
            }
            def actual = digest.digest().collect { String.format('%02x', it) }.join()
            if (actual == kotlinCompilerSha256) {
                logger.lifecycle("Verified cached Kotlin 2.4.21 compiler archive")
                return
            }
            archiveFile.delete()
        }
        archiveFile.parentFile.mkdirs()
        def tempFile = new File(archiveFile.parentFile, archiveFile.name + '.part')
        logger.lifecycle("Downloading Kotlin 2.4.21 command-line compiler (~86 MB)")
        new URL(kotlinCompilerUrl).withInputStream { input ->
            tempFile.withOutputStream { output ->
                byte[] buffer = new byte[1024 * 1024]
                int count
                while ((count = input.read(buffer)) > 0) output.write(buffer, 0, count)
            }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        tempFile.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            int count
            while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
        }
        def actual = digest.digest().collect { String.format('%02x', it) }.join()
        if (actual != kotlinCompilerSha256) {
            tempFile.delete()
            throw new GradleException("Kotlin compiler SHA-256 mismatch: " + actual)
        }
        if (!tempFile.renameTo(archiveFile)) {
            tempFile.delete()
            throw new GradleException("Could not place verified Kotlin compiler archive")
        }
    }
}

def jdkArchive = javaLibrariesOutput.get().file('jdk21-android.tar.gz')
def jdkUrl = 'https://github.com/MobileStudio-AndroidIDE/MobileStudio_AndroidIDE/releases/download/jdk21-android-21.0.4/jdk21-android.tar.gz'
def jdkSha256 = '9e38b66557db40481d90a6f5cfbce05180414e3131a6b77c4dea1304fcba6e9b'

tasks.register('downloadOpenJdk21') {
    outputs.file(jdkArchive)
    doLast {
        def archiveFile = jdkArchive.asFile
        if (archiveFile.exists()) {
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            archiveFile.withInputStream { input ->
                byte[] buffer = new byte[1024 * 1024]
                int count
                while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
            }
            def actual = digest.digest().collect { String.format('%02x', it) }.join()
            if (actual == jdkSha256) {
                logger.lifecycle("Verified cached OpenJDK 21 archive")
                return
            }
            archiveFile.delete()
        }
        archiveFile.parentFile.mkdirs()
        def tempFile = new File(archiveFile.parentFile, archiveFile.name + '.part')
        logger.lifecycle("Downloading full OpenJDK 21 ARM64 archive (~312 MB)")
        new URL(jdkUrl).withInputStream { input ->
            tempFile.withOutputStream { output ->
                byte[] buffer = new byte[1024 * 1024]
                int count
                while ((count = input.read(buffer)) > 0) output.write(buffer, 0, count)
            }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        tempFile.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            int count
            while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
        }
        def actual = digest.digest().collect { String.format('%02x', it) }.join()
        if (actual != jdkSha256) {
            tempFile.delete()
            throw new GradleException("OpenJDK 21 SHA-256 mismatch: " + actual)
        }
        if (!tempFile.renameTo(archiveFile)) {
            tempFile.delete()
            throw new GradleException("Could not place verified OpenJDK 21 archive")
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('downloadOpenJdk21')
    dependsOn tasks.named('downloadKotlinCompiler')
    dependsOn tasks.named('bundleJavaProjectLibraries')
}

// Asset generation can run before preBuild. Make the downloads explicit inputs
// of the Android asset-generation/merge tasks so they cannot be marked UP-TO-DATE
// before the offline archives exist.
tasks.configureEach { task ->
    if (task.name == 'generateDebugAssets' || task.name == 'mergeDebugAssets' || task.name == 'compressDebugAssets') {
        task.dependsOn tasks.named('downloadOpenJdk21')
        task.dependsOn tasks.named('downloadKotlinCompiler')
        task.dependsOn tasks.named('bundleJavaProjectLibraries')
    }
}


// Fail the APK build early with a useful message if any offline runtime/library bundle is absent.
tasks.register('verifyOfflineBundles') {
    dependsOn tasks.named('downloadOpenJdk21')
    dependsOn tasks.named('downloadKotlinCompiler')
    dependsOn tasks.named('bundleJavaProjectLibraries')
    doLast {
        def jdk = jdkArchive.asFile
        def kotlin = kotlinCompilerArchive.asFile
        def libs = javaLibrariesOutput.get().dir('java-libs').asFile
        if (!jdk.isFile() || jdk.length() < 100L * 1024L * 1024L) {
            throw new GradleException("OpenJDK bundle missing or unexpectedly small: ${jdk}")
        }
        if (!kotlin.isFile() || kotlin.length() < 10L * 1024L * 1024L) {
            throw new GradleException("Kotlin compiler bundle missing or unexpectedly small: ${kotlin}")
        }
        def jars = libs.exists() ? fileTree(libs).matching { include '*.jar' }.files : [] as Set
        if (jars.isEmpty()) {
            throw new GradleException("No Java project JAR libraries were bundled into ${libs}")
        }
        def invalid = jars.findAll { !it.isFile() || it.length() < 22 }
        if (!invalid.isEmpty()) {
            throw new GradleException("Invalid/empty Java project JAR(s): ${invalid}")
        }
        logger.lifecycle("Offline bundles verified: OpenJDK=${jdk.length()} bytes, Kotlin=${kotlin.length()} bytes, Java libraries=${jars.size()} JARs")
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyOfflineBundles')
}
